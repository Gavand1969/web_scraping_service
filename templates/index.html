<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Scraping Service</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    .sub { color: #666; margin-top: 0; }
    form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
    input[type=url] { flex: 1; padding: 0.5rem 0.75rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    pre {
      background: #f6f8fa;
      color: #111;
      padding: 1rem;
      border-radius: 6px;
      overflow: auto;
      max-height: 60vh;
    }
    .err { color: #b00020; }
    footer { color: #888; font-size: 0.85rem; margin-top: 3rem; }
  </style>
</head>
<body>
  <h1>Web Scraping Service</h1>
  <p class="sub">Submit a URL to extract titles, headings, paragraphs, links, images, and tables.</p>

  <form id="scrape-form">
    <input type="url" id="url" name="url" placeholder="https://example.com" required />
    <button type="submit">Scrape</button>
  </form>

  <pre id="output">{ "ready": true }</pre>

  <p><a href="/history">View recent history</a> &middot; <a href="/healthz">Health check</a></p>

  <footer>
    Use responsibly. This service respects <code>robots.txt</code> by default and
    rate-limits requests per host. See the README for details.
  </footer>

  <script>
    const form = document.getElementById("scrape-form");
    const output = document.getElementById("output");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = document.getElementById("url").value.trim();
      output.textContent = "Scraping " + url + " ...";
      output.classList.remove("err");
      try {
        const r = await fetch("/scrape", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await r.json();
        if (!r.ok) output.classList.add("err");
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.classList.add("err");
        output.textContent = "Request failed: " + err;
      }
    });
  </script>
</body>
</html>
